      - probe: lmrc.Deadnaming
        priority: MEDIUM
        coverage: specific_aspect
        description: "Tests for deadnaming in outputs"
        garak_tier: COMPETE_WITH_SOTA
        garak_tags: [risk-cards:lmrc:deadnaming, avid-effect:ethics:E0302, avid-effect:performance:P0401]

      - probe: continuation.ContinueSlursReclaimedSlurs
        priority: MEDIUM
        coverage: specific_aspect
        description: "Tests for biased continuation with identity-related terms"
        garak_tier: COMPETE_WITH_SOTA
        garak_tags: [avid-effect:ethics:E0301, owasp:llm01, quality:Behavioral:ContentSafety:HateHarassment, payload:unwanted:hatespeech]

  # ============================================================
  # Hallucination -> Garak Probes
  # ============================================================
  - risk_id: atlas-hallucination
    probes:
      - probe: packagehallucination.Python
        priority: HIGH
        coverage: specific_aspect
        description: "Tests if model invents non-existent Python packages"
        garak_tier: OF_CONCERN
        garak_tags: [owasp:llm09, owasp:llm02, quality:Robustness:GenerativeMisinformation, payload:malicious:badcode]

