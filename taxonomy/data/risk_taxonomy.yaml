- id: llm102025-unbounded-consumption
  name: LLM10:2025 Unbounded Consumption
  description: Unbounded Consumption refers to the process where a Large Language Model (LLM) generates
    outputs based on input queries or prompts. Inference is a critical function of LLMs, involving the
    application of learned patterns and knowledge to produce relevant responses or predictions. Attacks
    designed to disrupt service, deplete the target’s financial resources, or even steal intellectual
    property by cloning a model’s behavior all depend on a common class of security vulnerability in order
    to succeed. Unbounded Consumption occurs when a Large Language Model (LLM) application allows users
    to conduct excessive and uncontrolled inferences, leading to risks such as denial of service (DoS),
    economic losses, model theft, and service degradation.
