- id: atlas-over-or-under-reliance-on-ai-agents-agentic
  name: Over- or under-reliance on AI agents
  description: Reliance, that is the willingness to accept an AI agent behavior, depends on how much a
    user trusts that agent and what they are using it for. Over-reliance occurs when a user puts too much
    trust in an AI agent, accepting an AI agent’s behavior even when it is likely undesired. Under-reliance
    is the opposite, where the user doesn’t trust the AI agent but should. Increasing autonomy (to take
    action, select and consult resources/tools) of AI agents and the possibility of opaqueness and open-endedness
