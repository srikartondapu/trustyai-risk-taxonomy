- id: llm062025-excessive-agency
  name: LLM06:2025 Excessive Agency
  description: An LLM-based system is often granted a degree of agency by its developer - the ability
    to call functions or interface with other systems via extensions (sometimes referred to as tools,
    skills or plugins by different vendors) to undertake actions in response to a prompt. The decision
    over which extension to invoke may also be delegated to an LLM 'agent' to dynamically determine based
    on input prompt or LLM output. Agent-based systems will typically make repeated calls to an LLM using
    output from previous invocations to ground and direct subsequent invocations. Excessive Agency is
    the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous
    or manipulated outputs from an LLM, regardless of what is causing the LLM to malfunction.
  isDefinedByTaxonomy: owasp-llm-2.0
  isPartOf:
  risk_type:
  tag:
